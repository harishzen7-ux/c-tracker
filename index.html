    <script>
      // Early Monaco Worker interceptor to prevent cross-origin importScripts NetworkErrors in sandbox iframes
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.indexOf('importScripts') !== -1 || e.message.indexOf('editor.worker') !== -1 || e.message.indexOf('WorkerGlobalScope') !== -1)) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.MonacoEnvironment = {
        getWorker: function() {
          try {
            var blob = new Blob(['self.onmessage = function() {};'], { type: 'application/javascript' });
            return new Worker(URL.createObjectURL(blob));
          } catch(err) {
            return {
              postMessage: function() {},
              addEventListener: function() {},
              removeEventListener: function() {},
              terminate: function() {}
            };
          }
        }
      };
    </script>

  </body>
